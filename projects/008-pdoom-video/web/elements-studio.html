<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>现成元素 · 原始代码绘画引擎</title><style>body{margin:0;background:#f3ebdc}.p5Canvas{display:none!important}#out{display:block;width:100%;height:auto}#status{font:13px/1.6 system-ui,sans-serif;padding:8px;margin:0;color:#5e584e}</style><script src="vendor/p5.min.js"></script><script src="vendor/p5.brush.js"></script></head><body><canvas id="out" width="1920" height="1080" aria-label="原始角色函数按参数绘制的画面"></canvas><p id="status" role="status">正在初始化原始绘画引擎…</p>
<script src="vendor/pdoom/core.js"></script><script src="vendor/pdoom/clawd.js"></script><script src="vendor/pdoom/cast.js"></script><script src="vendor/pdoom/props.js"></script><script src="vendor/pdoom/lyrics.js"></script><script src="vendor/pdoom/timeline.js"></script><script>const CAST={};function devUI(){}</script><script src="vendor/pdoom/ch/c01_lab.js"></script><script src="vendor/pdoom/ch/c02_chorus1.js"></script><script src="vendor/pdoom/ch/c03_takeoff.js"></script><script src="vendor/pdoom/ch/c04_chorus2.js"></script><script src="vendor/pdoom/ch/c05_obsolete.js"></script><script src="vendor/pdoom/ch/c06_chorus3.js"></script><script src="vendor/pdoom/ch/c07_scale.js"></script><script src="vendor/pdoom/ch/c08_chorus4.js"></script><script src="vendor/pdoom/ch/c09_finale.js"></script><script src="elements-data.js"></script><script src="elements-scene.js"></script>
<script>
  let drawing=false,pending=null;
  const post=message=>{if(parent!==window&&/^https?:$/.test(location.protocol))parent.postMessage(message,location.origin);};
  async function apply(){if(drawing||!window.ready||!pending)return;drawing=true;try{while(pending){const request=pending;pending=null;document.querySelector('#status').textContent='正在用原始代码绘制…';try{const result=await driveElement(request.input);document.querySelector('#status').textContent='实际重绘完成 · '+Math.round(result.renderMs)+' ms';post({type:'element-result',requestId:request.requestId,renderMs:result.renderMs,input:result.controller,pose:result.pose});}catch(error){post({type:'element-error',requestId:request.requestId,message:error.message});}}}finally{drawing=false;}}
  window.addEventListener('message',event=>{if(event.source!==parent||event.origin!==location.origin||event.data?.type!=='drive-element')return;pending=event.data;apply();});
  const check=setInterval(()=>{if(window.ready&&window.elementSceneReady){clearInterval(check);document.querySelector('#status').hidden=true;post({type:'element-ready'});apply();}},100);
  window.addEventListener('error',event=>{document.querySelector('#status').textContent='绘画引擎错误：'+event.message;});
</script></body></html>
