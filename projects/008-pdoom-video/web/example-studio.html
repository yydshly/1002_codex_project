<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>点亮一盏灯 · 实际代码重绘</title><link rel="icon" href="favicon.svg"><style>body{margin:0;background:#f3ebdc;color:#2b2233;font:16px/1.6 system-ui,sans-serif}main{max-width:1200px;margin:auto;padding:24px}.p5Canvas{display:none!important}#out{display:block;width:100%;height:auto;aspect-ratio:16/9}.controls{display:flex;gap:16px;flex-wrap:wrap;align-items:center;margin:20px 0}input{flex:1;min-width:120px}a{color:#9b4c37}body.render .intro,body.render .controls{display:none}body.render main{padding:0}label{display:flex;gap:8px;align-items:center}select,button{padding:8px}#status{min-height:26px}</style><script src="vendor/p5.min.js"></script><script src="vendor/p5.brush.js"></script></head>
<body><main><div class="intro"><a href="example.html">← 返回实际样例</a><h1>用上游绘画代码，重绘新的故事</h1><p>本页执行新增场景代码和 PDoomVideo 原始 core.js、clawd.js，输出一张 1920×1080 画面。每步前进 1/12 秒；切换时间、风格或上色步骤时会重新绘制，请等待。</p><p id="status" role="status">正在初始化绘画引擎…</p></div><canvas id="out" width="1920" height="1080" aria-label="角色按按钮点亮灯泡的实际绘制画面"></canvas><div class="controls"><label for="studio-time">时间</label><input id="studio-time" type="range" min="0" max="72" value="45" step="1"><output id="studio-readout">3.75 s</output><label>风格<select id="studio-style"><option value="warm">暖色水彩</option><option value="cool">冷色水彩</option><option value="flat">清晰平涂</option></select></label><label>上色步骤<select id="studio-layer"><option value="outline">形状与轮廓</option><option value="flat">铺底色</option><option value="brush">水彩与阴影</option><option value="paper" selected>纸纹与成帧</option></select></label></div></main>
<script src="vendor/pdoom/core.js"></script><script src="vendor/pdoom/clawd.js"></script><script>let METER_SHOWN=false; if(location.search.includes('render'))document.body.classList.add('render'); function devUI(){}</script><script src="example-scene.js"></script>
<script>
  const params=new URLSearchParams(location.search),time=document.querySelector('#studio-time'),style=document.querySelector('#studio-style'),layerControl=document.querySelector('#studio-layer'),status=document.querySelector('#status');
  if(params.has('t')&&Number.isFinite(Number(params.get('t'))))time.value=String(Math.round(Math.max(0,Math.min(6,Number(params.get('t'))))*12));
  if(['warm','cool','flat'].includes(params.get('style')))style.value=params.get('style');
  let busy=false,pending=false;
  async function render(){pending=true;if(busy||!window.ready)return;busy=true;try{while(pending){pending=false;status.textContent='正在用原始绘画引擎重新绘制…';const frame=await scenarioRender(Number(time.value)/12,style.value,layerControl.value);document.querySelector('#studio-readout').textContent=frame.pose.t.toFixed(2)+' s';status.textContent='重绘完成 · '+Math.round(frame.renderMs)+' ms / 帧';}}catch(error){status.textContent='重绘失败：'+error.message;}finally{busy=false;}}
  for(const control of [time,style,layerControl])control.addEventListener('change',render);
  window.addEventListener('error',event=>{status.textContent='加载失败：'+event.message;});
  const check=setInterval(()=>{if(window.ready){clearInterval(check);if(!params.has('render'))render();}},100);
</script></body></html>
