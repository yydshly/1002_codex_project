<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#143e42">
  <title>Tidewater · 研究与可控 3D 产品思路总图</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%23166b5c'/%3E%3Ctext x='11' y='46' font-size='48' fill='white'%3E≈%3C/text%3E%3C/svg%3E">
  <style>
    :root{color-scheme:light;--ink:#17363a;--muted:#536970;--green:#166b5c;--line:#c9d3d0;--paper:#f5f3ec}
    *{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:14px/1.6 "Microsoft YaHei",system-ui,sans-serif}a{color:var(--green);text-decoration:none}a:hover{text-decoration:underline}button,a.action{font:inherit;background:white;color:var(--ink);border:1px solid var(--line);border-radius:6px;min-height:36px;padding:7px 13px;cursor:pointer}button:hover,a.action:hover{background:#e4f2eb;text-decoration:none}button:focus-visible,a:focus-visible{outline:3px solid #365d86;outline-offset:3px}header{padding:15px 22px 12px;background:#fff;border-bottom:1px solid var(--line)}.heading{display:flex;justify-content:space-between;gap:20px;align-items:center;flex-wrap:wrap}h1{font-size:19px;line-height:1.4;margin:0}p{margin:5px 0 0;color:var(--muted);font-size:12px}.actions{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.actions output{min-width:46px;text-align:center;font-variant-numeric:tabular-nums;font-size:12px}.navigation{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}.navigation button{font-size:12px;min-height:30px;padding:4px 10px;border-color:transparent;background:var(--paper)}#viewport{overflow:auto;height:calc(100dvh - 156px);padding:16px;scrollbar-gutter:stable;overscroll-behavior:contain;background:#e8ece5}#map{display:block;height:auto;background:var(--paper);max-width:none;box-shadow:0 3px 16px #17363a15}footer{padding:10px 22px;background:white;border-top:1px solid var(--line);display:flex;gap:16px;flex-wrap:wrap;font-size:12px}#map-status{color:var(--muted)}@media(max-width:680px){header{padding:12px}.heading{gap:10px}h1{font-size:17px}.actions{gap:5px}.actions button,.actions a.action{padding:6px 9px}#viewport{height:calc(100dvh - 232px);padding:8px}.navigation{gap:4px}.navigation button{padding:4px 7px}footer{padding:10px 12px}}
  </style>
</head>
<body>
  <header>
    <div class="heading">
      <div><h1>从你的图与粗模，到可控的 3D 世界</h1><p>真实场景画面对照 · 研究与探索过程 · 入口与出口 · 生成与控制 · 验证边界与产品方向。</p></div>
      <div class="actions" aria-label="总图缩放与下载">
        <button id="fit" type="button">适合宽度</button>
        <button id="minus" type="button" aria-label="缩小总图">−</button><output id="zoom" aria-live="polite">—</output><button id="plus" type="button" aria-label="放大总图">＋</button>
        <a class="action" href="assets/tidewater-product-research-map.svg" target="_blank" rel="noopener">矢量原图 ↗</a>
        <a class="action" href="assets/tidewater-product-research-map.png" download="Tidewater-研究与产品思路总图.png">下载 PNG ↓</a>
      </div>
    </div>
    <nav class="navigation" aria-label="总图章节位置">
      <button type="button" data-y="856">00 场景回顾</button><button type="button" data-y="1604">01 探索过程</button><button type="button" data-y="2010">02 能力与原理</button><button type="button" data-y="2616">03 产品主轴</button><button type="button" data-y="3667">04 如何控制</button><button type="button" data-y="4314">05 出口</button><button type="button" data-y="4790">06 验证与边界</button><button type="button" data-y="5546">07 扩展方向</button>
    </nav>
  </header>
  <main id="viewport" aria-label="可缩放研究总图：放大后可横向与纵向滚动查看">
    <img id="map" src="assets/tidewater-product-research-map.svg" width="2520" height="6474" alt="Tidewater 研究与可控 3D 场景产品思路总图。背景左侧为源库作者的午后海滩截图，右侧为我们的08三岛与红白灯塔候选。下方对照同一份200×150米、25区域/对象的绘笔布局、粗模和模型候选。核心：用户的图或粗模确定空间意图，模型组织工具生成与修正，产品让同一份作品可检查、局部修改、保存恢复与交付。图中包含探索过程、原理、入口、控制与验收、出口、验证边界和八个扩展方向。">
  </main>
  <footer><a href="release.html">当前成果与使用说明 ↗</a><a href="capabilities.html">能力归档 ↗</a><a href="camp.html">原场景提案 ↗</a><span id="map-status" role="status">正在加载总图…</span><a href="research.html#scene-completion-experiment">查看研究依据</a><a href="create.html?entry=image#scene-completion-panel">返回当前场景实验</a><a href="https://github.com/dgreenheck/tidewater/tree/4811ba48d795197de5621985f404e765c0b7c0ef" target="_blank" rel="noopener">上游固定源码基线</a></footer>
  <script>
    const viewport=document.getElementById('viewport'),map=document.getElementById('map'),zoom=document.getElementById('zoom');let scale=1,fitted=true;
    function apply(next,keepCenter=true){const old=scale,cx=(viewport.scrollLeft+viewport.clientWidth/2)/old,cy=(viewport.scrollTop+viewport.clientHeight/2)/old;scale=Math.max(.1,Math.min(2,next));map.style.width=`${2520*scale}px`;zoom.value=`${Math.round(scale*100)}%`;if(keepCenter){viewport.scrollLeft=cx*scale-viewport.clientWidth/2;viewport.scrollTop=cy*scale-viewport.clientHeight/2;}}
    function fit(){fitted=true;apply((viewport.clientWidth-32)/2520,false);viewport.scrollLeft=0;}
    document.getElementById('fit').addEventListener('click',fit);
    document.getElementById('plus').addEventListener('click',()=>{fitted=false;apply(scale*1.25);});
    document.getElementById('minus').addEventListener('click',()=>{fitted=false;apply(scale/1.25);});
    document.querySelectorAll('[data-y]').forEach(button=>button.addEventListener('click',()=>viewport.scrollTo({top:Number(button.dataset.y)*scale+16,behavior:'smooth'})));
    map.addEventListener('load',()=>{fit();document.getElementById('map-status').textContent='2520 × 6474 · 文字可放大 · 已研究 / 已验证 / 待扩展逐处标注';});
    map.addEventListener('error',()=>document.getElementById('map-status').textContent='总图未载入，请检查本地服务。');
    new ResizeObserver(()=>{if(fitted)fit();}).observe(viewport);fit();
  </script>
</body>
</html>
