<title id="title">text-to-cad 能力、原理、效果、价值与边界总览</title>
<desc id="desc">用户提供真实需求；语言模型设计和写代码；插件调用 OpenCascade；保存并验收。涵盖核心能力、扩展工作流、三组实测、配件输入、个人价值与复杂产品瓶颈。</desc>
