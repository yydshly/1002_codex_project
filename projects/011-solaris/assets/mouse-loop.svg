<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="810" viewBox="0 0 1440 810" role="img" aria-labelledby="title desc">
  <title id="title">Solaris：鼠标操作与语义共同驱动生成画面的原理示意</title>
  <desc id="desc">原创概念封面，四个步骤：当前画面与鼠标输入，动作与语义条件，生成下一帧，看到结果继续操作。非官方截图，非官方实测。</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f3f4e9"/><stop offset="1" stop-color="#e5edda"/></linearGradient>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M1 1L8 5L1 9" fill="none" stroke="#6a8c6b" stroke-width="1.6"/></marker>
  </defs>
  <rect width="1440" height="810" fill="url(#background)"/>
  <g font-family="system-ui, Microsoft YaHei, sans-serif">
    <rect x="70" y="55" width="56" height="36" rx="8" fill="#21695b"/><text x="98" y="80" fill="#fff" font-size="18" text-anchor="middle">011</text>
    <text x="145" y="80" fill="#526a59" font-size="19" letter-spacing="3">SOLARIS / 能力研究</text>
    <text x="70" y="175" fill="#1e3631" font-size="53" font-weight="600">鼠标如何驱动画面？</text>
    <text x="72" y="223" fill="#546a57" font-size="23">位置与轨迹 + 当前画面 + 操作语义 → 下一帧</text>
    <g transform="translate(74 280)">
      <rect width="278" height="274" rx="16" fill="#fffdf4" stroke="#c9d5bf"/>
      <text x="22" y="35" font-size="15" fill="#658454">01 / 当前画面与操作</text>
      <rect x="24" y="57" width="230" height="131" rx="6" fill="#e6dfd0"/>
      <path d="M24 151H254V188H24Z" fill="#bca888"/>
      <rect x="146" y="78" width="66" height="46" fill="#8d7453"/><rect x="152" y="84" width="54" height="34" fill="#bdcaa5"/>
      <path d="M89 159V109" stroke="#7b6446" stroke-width="5"/><path d="M66 109L73 81H104L111 109Z" fill="#e8bd7d"/>
      <rect x="151" y="143" width="79" height="23" rx="6" fill="#789781"/>
      <path d="M115 127L161 111" stroke="#21695b" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
      <path d="M112 124L117 152L124 141L137 141Z" fill="#21695b" stroke="#fffdf4" stroke-width="2"/>
      <text x="24" y="222" fill="#294b42" font-size="19">点击 · 拖拽 · 文字要求</text><text x="24" y="248" fill="#657560" font-size="14">鼠标只给出位置与轨迹</text>
    </g>
    <path d="M365 410H398" fill="none" stroke="#6a8c6b" stroke-width="2.5" marker-end="url(#arrow)"/>
    <g transform="translate(414 280)">
      <rect width="278" height="274" rx="16" fill="#fffdf4" stroke="#c9d5bf"/>
      <text x="22" y="35" font-size="15" fill="#658454">02 / 动作与语义条件</text>
      <rect x="24" y="60" width="230" height="35" rx="6" fill="#e5eddb"/><text x="40" y="83" fill="#355d48" font-size="17">移动对象</text>
      <rect x="24" y="104" width="230" height="35" rx="6" fill="#edf0e5"/><text x="40" y="127" fill="#526a4e" font-size="17">调整光照</text>
      <rect x="24" y="148" width="230" height="35" rx="6" fill="#edf0e5"/><text x="40" y="171" fill="#526a4e" font-size="17">缩放挂画</text>
      <text x="24" y="222" fill="#294b42" font-size="18">同一拖动，可以不同含义</text><text x="24" y="248" fill="#657560" font-size="14">语义需要由上下文界定</text>
    </g>
    <path d="M705 410H738" fill="none" stroke="#6a8c6b" stroke-width="2.5" marker-end="url(#arrow)"/>
    <g transform="translate(754 280)">
      <rect width="278" height="274" rx="16" fill="#fffdf4" stroke="#c9d5bf"/>
      <text x="22" y="35" font-size="15" fill="#658454">03 / 生成下一帧</text>
      <rect x="40" y="68" width="177" height="99" rx="7" fill="#d4dfc4"/>
      <rect x="50" y="77" width="177" height="99" rx="7" fill="#e0e7d3"/>
      <rect x="60" y="86" width="177" height="99" rx="7" fill="#eceddf" stroke="#8ca57c"/>
      <path d="M145 147V110" stroke="#7b6446" stroke-width="4"/><path d="M125 110L130 92H155L163 110Z" fill="#e8bd7d"/>
      <path d="M60 156H237V185H60Z" fill="#d4c4a9"/>
      <text x="24" y="222" fill="#294b42" font-size="19">画面条件 → 生成结果</text><text x="24" y="248" fill="#657560" font-size="14">逐帧自回归的公开机制</text>
    </g>
    <path d="M1045 410H1078" fill="none" stroke="#6a8c6b" stroke-width="2.5" marker-end="url(#arrow)"/>
    <g transform="translate(1094 280)">
      <rect width="278" height="274" rx="16" fill="#fffdf4" stroke="#c9d5bf"/>
      <text x="22" y="35" font-size="15" fill="#658454">04 / 可见结果与反馈</text>
      <circle cx="139" cy="125" r="43" fill="#e6edd9"/>
      <path d="M127 100C156 89 176 116 161 140M159 131L161 144L172 140M150 151C121 163 102 134 118 111M118 121L117 108L106 111" fill="none" stroke="#397660" stroke-width="4" stroke-linecap="round"/>
      <text x="24" y="222" fill="#294b42" font-size="18">看到变化，再继续操作</text><text x="24" y="248" fill="#657560" font-size="14">新画面成为下一轮状态</text>
    </g>
    <path d="M1233 569V612H213V572" fill="none" stroke="#86a17b" stroke-width="2" stroke-dasharray="8 7" marker-end="url(#arrow)"/>
    <text x="602" y="644" fill="#5e7658" font-size="16">反馈闭环 · 原理示意</text>
    <path d="M70 698H1370" stroke="#c0cfb5"/>
    <text x="72" y="740" fill="#355540" font-size="20">原创概念封面 · 非官方实测</text>
    <text x="1370" y="740" fill="#687e60" font-size="16" text-anchor="end">本地网页为规则演示，未接入 Solaris</text>
  </g>
</svg>
