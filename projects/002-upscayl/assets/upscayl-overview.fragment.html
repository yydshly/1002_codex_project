  const body = root.querySelector('#detail-rows');
  const heading = root.querySelector('#detail-heading');
  const sourceBox = root.querySelector('#detail-sources');
  const buttons = Array.from(root.querySelectorAll('button[data-key]'));
  let selected = 'overview';
  function select(key, save) {
    if (!items[key]) key = 'overview';
    selected = key;
    const item = items[key];
    heading.textContent = item.title;
    body.replaceChildren();
    for (const [label, meaning] of item.rows) {
      const tr = document.createElement('tr');
      const th = document.createElement('th'); th.scope = 'row'; th.textContent = label;
      const td = document.createElement('td'); td.textContent = meaning;
      tr.append(th, td); body.append(tr);
    }
    sourceBox.replaceChildren();
    for (const sourceKey of item.sources) {
      const a = document.createElement('a');
      a.textContent = src[sourceKey][0]; a.href = src[sourceKey][1];
      a.target = '_blank'; a.rel = 'noopener noreferrer'; sourceBox.append(a);
    }
    for (const button of buttons) {
      const active = button.dataset.key === key;
      button.setAttribute('aria-pressed', String(active));
      button.classList.toggle('btn-primary', active);
    }
    if (save && window.openai && typeof window.openai.setWidgetState === 'function') {
      window.openai.setWidgetState({modelContent:{selectedModule:key},privateContent:{selectedModule:key}}).catch(() => {});
    }
  }
  for (const button of buttons) button.addEventListener('click', () => select(button.dataset.key, true));
  const state = window.openai && window.openai.widgetState;
  if (state) selected = state.selectedModule || (state.privateContent && state.privateContent.selectedModule) || (state.modelContent && state.modelContent.selectedModule) || selected;
  select(selected, false);
  window.addEventListener('openai:set_globals', (event) => {
    const next = event.detail && event.detail.globals && event.detail.globals.widgetState;
    if (next) select(next.selectedModule || (next.privateContent && next.privateContent.selectedModule) || (next.modelContent && next.modelContent.selectedModule) || selected, false);
  });
  const surface = root.querySelector('.map-surface');
  const svg = root.querySelector('.map-links');
  const ns = 'http://www.w3.org/2000/svg';
  function draw() {
    const box = surface.getBoundingClientRect();
    const width = box.width, height = box.height;
    if (!width || !height) return;
    svg.setAttribute('viewBox', `0 0 ${width} ${height}`);
    svg.replaceChildren();
    const defs = document.createElementNS(ns,'defs');
    for (let i=1;i<=3;i++) {
      const marker = document.createElementNS(ns,'marker');
      marker.id = `upscayl-arrow-${i}`; marker.setAttribute('viewBox','0 0 10 10');
      marker.setAttribute('refX','8'); marker.setAttribute('refY','5'); marker.setAttribute('markerWidth','5'); marker.setAttribute('markerHeight','5'); marker.setAttribute('orient','auto-start-reverse');
      const mark = document.createElementNS(ns,'path'); mark.setAttribute('d','M 1 1 L 8 5 L 1 9 Z'); mark.setAttribute('fill',`var(--viz-series-${i})`); marker.append(mark); defs.append(marker);
    }
    svg.append(defs);
    const rect = (el) => { const r=el.getBoundingClientRect(); return {x:r.left-box.left,y:r.top-box.top,w:r.width,h:r.height}; };
    function path(d, series, arrow=false) {
      const p=document.createElementNS(ns,'path'); p.setAttribute('d',d); p.setAttribute('fill','none');
      p.setAttribute('stroke',`var(--viz-series-${series})`); p.setAttribute('stroke-width','1.5'); p.setAttribute('opacity','0.65');
      if (arrow) p.setAttribute('marker-end',`url(#upscayl-arrow-${series})`); svg.append(p);
    }
    const top=rect(root.querySelector('.map-root button'));
    const lanes=Array.from(root.querySelectorAll('.map-lane'));
    const narrow=width<600;
    lanes.forEach((lane,index) => {
      const label=rect(lane.querySelector('h3'));
      if (!narrow) {
        const midY=(top.y+top.h+label.y)/2;
        path(`M ${top.x+top.w/2} ${top.y+top.h} V ${midY} H ${label.x+label.w/2} V ${label.y-5}`,index+1);
      }
      const nodes=Array.from(lane.querySelectorAll('.map-node button')).map(rect);
      if (index===0 || narrow) {
        const x=rect(lane).x+(narrow?9:2);
        path(`M ${x} ${nodes[0].y+nodes[0].h/2} V ${nodes[nodes.length-1].y+nodes[nodes.length-1].h/2}`,index+1);
        nodes.forEach(n=>path(`M ${x} ${n.y+n.h/2} H ${n.x-3}`,index+1));
      } else {
        for (let i=0;i<nodes.length-1;i++) path(`M ${nodes[i].x+nodes[i].w/2} ${nodes[i].y+nodes[i].h+2} V ${nodes[i+1].y-4}`,index+1,true);
      }
    });
    if (!narrow) {
      const trained=rect(root.querySelector('[data-key="weights"]'));
      const runtime=rect(root.querySelector('[data-key="backend"]'));
      const corridor=(trained.x+trained.w+runtime.x)/2;
      path(`M ${trained.x+trained.w+2} ${trained.y+trained.h/2} H ${corridor} V ${runtime.y+runtime.h/2} H ${runtime.x-4}`,2,true);
      const losses=rect(root.querySelector('[data-key="loss"]'));
      const network=rect(root.querySelector('[data-key="network"]'));
      const x=network.x-7;
      path(`M ${losses.x-2} ${losses.y+losses.h/2} H ${x} V ${network.y+network.h/2} H ${network.x-3}`,2,true);
    }
  }
  const observer=new ResizeObserver(draw); observer.observe(surface);
  window.addEventListener('resize',draw);
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(draw);
  draw();
})();
</script>
