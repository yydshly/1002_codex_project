      [&#x27;使用体验&#x27;,&#x27;提供中文等语言、剪贴板图片输入、日志和系统信息。&#x27;],
      [&#x27;本地处理&#x27;,&#x27;图像推理在本机执行；更新检查和可选统计与图像推理属于不同功能。&#x27;]
    ],sources:[&#x27;release&#x27;,&#x27;format&#x27;,&#x27;app&#x27;]},
    data:{title:&#x27;训练数据：把高清图变成学习样本&#x27;,rows:[
      [&#x27;HR / GT&#x27;,&#x27;High Resolution / Ground Truth：高清参考图，作为训练时的目标。&#x27;],
      [&#x27;LR / LQ&#x27;,&#x27;Low Resolution / Low Quality：经过缩放及劣化后的输入。&#x27;],
      [&#x27;高阶劣化&#x27;,&#x27;重复组合模糊、缩放、噪声和 JPEG，接近拍摄、编辑与网络传播造成的复杂劣化。&#x27;],
      [&#x27;sinc 滤波&#x27;,&#x27;训练数据合成中用于模拟振铃、过冲等边缘伪影。&#x27;],
      [&#x27;数据集&#x27;,&#x27;官方训练使用 DIV2K、Flickr2K、OST；训练可由高清图在线生成低质量配对。&#x27;]
    ],sources:[&#x27;paper&#x27;,&#x27;training&#x27;]},
    network:{title:&#x27;深度学习、CNN 与网络结构&#x27;,rows:[
      [&#x27;深度学习&#x27;,&#x27;用多层神经网络和训练数据学习参数；这里是专用图像模型。&#x27;],
      [&#x27;CNN / 卷积神经网络&#x27;,&#x27;用可学习的卷积核在局部区域计算，提取并组合边缘、线条与纹理特征。&#x27;],
      [&#x27;网络结构 + 权重&#x27;,&#x27;结构定义如何计算；权重是训练调整的数值；两者共同构成部署模型。&#x27;],
      [&#x27;RRDB&#x27;,&#x27;Residual-in-Residual Dense Block：结合残差与密集连接，帮助特征传递；经典 Real-ESRGAN 生成器所用。&#x27;],
      [&#x27;适用范围&#x27;,&#x27;这里的 RRDB 说明针对经典模型；Lite 或社区模型可能使用不同的网络结构。&#x27;]
    ],sources:[&#x27;torch&#x27;,&#x27;paper&#x27;]},
    gan:{title:&#x27;GAN：训练时的生成与判别&#x27;,rows:[
      [&#x27;GAN&#x27;,&#x27;Generative Adversarial Network：生成对抗网络，一种联合训练生成器和判别器的框架。&#x27;],
      [&#x27;生成器 G&#x27;,&#x27;在超分辨率中，输入低质量图，输出预测的高清图。&#x27;],
      [&#x27;判别器 D&#x27;,&#x27;学习区分真实高清图与生成图，并给生成器提供逼真程度的反馈。&#x27;],
      [&#x27;U-Net + 谱归一化&#x27;,&#x27;经典 Real-ESRGAN 判别器采用 U-Net，提供局部反馈；谱归一化有助于训练稳定。&#x27;],
      [&#x27;训练与使用&#x27;,&#x27;训练中交替更新 G、D；日常图片增强通常只运行训练好的 G。&#x27;]
    ],sources:[&#x27;gan&#x27;,&#x27;paper&#x27;,&#x27;compute&#x27;]},
    loss:{title:&#x27;训练目标与参数更新&#x27;,rows:[
      [&#x27;L1 像素损失&#x27;,&#x27;比较预测图与参考图的像素绝对差异，关注数值接近。&#x27;],
      [&#x27;感知损失&#x27;,&#x27;比较视觉网络提取的特征，关注结构与纹理的相似性。&#x27;],
      [&#x27;GAN 对抗损失&#x27;,&#x27;根据判别器反馈，鼓励输出呈现真实高清图片的纹理特征。&#x27;],
      [&#x27;反向传播 / 梯度&#x27;,&#x27;计算每个参数的变化如何影响损失，获得调整方向的信息。&#x27;],
      [&#x27;Adam / 优化器&#x27;,&#x27;根据梯度小步更新参数；训练反复执行预测、评分、求梯度和更新。&#x27;],
      [&#x27;两阶段训练&#x27;,&#x27;先用 L1 训练 Real-ESRNet；再以此初始化生成器，用 L1 + 感知 + GAN 训练 Real-ESRGAN。&#x27;]
    ],sources:[&#x27;training&#x27;,&#x27;grad&#x27;,&#x27;paper&#x27;]},
    weights:{title:&#x27;从训练结果到部署模型&#x27;,rows:[
      [&#x27;预训练&#x27;,&#x27;模型已经用大量样本学好参数；用户放大新图片时可直接调用。&#x27;],
      [&#x27;训练环境&#x27;,&#x27;Real-ESRGAN 官方训练使用 PyTorch，常配合 CUDA / NVIDIA GPU；与桌面推理环境有区别。&#x27;],
      [&#x27;部署转换&#x27;,&#x27;将支持的模型转换为 NCNN 格式；.param 保存结构描述，.bin 保存权重。&#x27;],
      [&#x27;微调 / Fine-tuning&#x27;,&#x27;在现有参数基础上，用你的领域数据继续训练；需要数据、训练代码与计算资源。&#x27;],
      [&#x27;功能边界&#x27;,&#x27;图中训练支线是模型来源说明，Upscayl 桌面端主要负责推理，不提供完整训练流程。&#x27;]
    ],sources:[&#x27;training&#x27;,&#x27;custom&#x27;,&#x27;compute&#x27;]},
    environment:{title:&#x27;运行环境与显卡的职责&#x27;,rows:[
      [&#x27;操作系统&#x27;,&#x27;桌面版面向 Windows、macOS、Linux；具体安装包与最低版本以发布说明为准。&#x27;],
      [&#x27;环境准备&#x27;,&#x27;驱动、运行程序、后端二进制、模型文件及路径的准备，由操作系统和程序完成。&#x27;],
      [&#x27;Vulkan 兼容性&#x27;,&#x27;正常推理路径需要兼容 GPU 与驱动；部分核显可用，需要实际确认。&#x27;],
      [&#x27;GPU 的职责&#x27;,&#x27;执行卷积等大量并行计算；显卡提供算力与显存，模型决定计算结构与参数。&#x27;]
    ],sources:[&#x27;compatibility&#x27;,&#x27;app&#x27;,&#x27;package&#x27;]},
    ui:{title:&#x27;桌面界面与任务管理&#x27;,rows:[

    backend:{title:&#x27;从桌面操作到模型执行&#x27;,rows:[

      [&#x27;upscayl-ncnn&#x27;,&#x27;C++ 推理后端与 CLI，从 Real-ESRGAN-ncnn-vulkan 派生；可脱离 GUI 使用。&#x27;],
      [&#x27;NCNN&#x27;,&#x27;神经网络推理框架：加载网络结构与权重，安排算子执行。&#x27;],
      [&#x27;推理 / Inference&#x27;,&#x27;用固定参数对新图片做前向计算；这里无需为每张图片重新训练。&#x27;]

    gpu:{title:&#x27;GPU、Vulkan 与分块推理&#x27;,rows:[

      [&#x27;GPU / 显卡&#x27;,&#x27;并行执行计算；速度受硬件、模型和图片尺寸影响。&#x27;],
      [&#x27;VRAM / 显存&#x27;,&#x27;保存模型与中间计算结果；大图和较重模型会增加需求。&#x27;],

      [&#x27;资源边界&#x27;,&#x27;分块增加调度开销，并可能带来局部不一致；整张输出仍需要内存与磁盘。&#x27;]

    post:{title:&#x27;从网络预测到图片文件&#x27;,rows:[

      [&#x27;后处理缩放&#x27;,&#x27;当目标尺寸与模型原生输出不一致时，可用普通重采样调整大小。&#x27;],
      [&#x27;编码 / Export&#x27;,&#x27;把像素数据保存为指定格式；压缩、尺寸与文件大小共同影响交付结果。&#x27;],
      [&#x27;进度与结果&#x27;,&#x27;后端处理状态由应用读取并展示；成功输出仍应检查文字、线条和纹理。&#x27;]
    ],sources:[&#x27;main&#x27;,&#x27;compute&#x27;,&#x27;format&#x27;]},
    use:{title:&#x27;后期价值：素材加工&#x27;,rows:[

      [&#x27;价值取决于业务&#x27;,&#x27;原图已经足够清晰，或主要使用矢量素材时，超分辨率收益可能较小。&#x27;]
    ],sources:[&#x27;app&#x27;,&#x27;paper&#x27;]},
    automation:{title:&#x27;后期价值：脚本与流水线&#x27;,rows:[

    learning:{title:&#x27;后期价值：算法学习与产品实现&#x27;,rows:[
      [&#x27;学习算法&#x27;,&#x27;重点看上游训练：数据劣化、网络结构、损失设计、效果评估和领域微调。&#x27;],
      [&#x27;学习工程&#x27;,&#x27;重点看 Upscayl：界面与本机进程协作、文件管理、任务进度、模型加载、分块与跨平台打包。&#x27;],
      [&#x27;可迁移的框架&#x27;,&#x27;业务任务 → 数据与模型 → 执行框架 → 硬件 → 结果；其他 AI 任务可能采用不同网络。&#x27;],
      [&#x27;建议顺序&#x27;,&#x27;先用真实素材评估 → 学会 CLI 批处理 → 阅读调用链 → 有领域需求再考虑微调。&#x27;]
    ],sources:[&#x27;training&#x27;,&#x27;package&#x27;,&#x27;spawn&#x27;,&#x27;cli&#x27;]},
    limits:{title:&#x27;能力边界、资源与复用条件&#x27;,rows:[
      [&#x27;保真与观感&#x27;,&#x27;模型预测合理细节；可能出现假纹理、文字变化或线条扭曲，不能把增强结果当作原始事实。&#x27;],
      [&#x27;严重失焦 / 全模糊&#x27;,&#x27;官方 FAQ 明确指出这类图片不适合 Upscayl；优先寻找高清原图或原始文件。&#x27;],
      [&#x27;倍率边界&#x27;,&#x27;新增像素不等于新增真实信息；Double 并不保证效果更好。&#x27;],

      [&#x27;开源与授权&#x27;,&#x27;应用和后端为 AGPL-3.0；改造发布或服务化需评估许可条件，自定义模型的权重许可需分别核实。&#x27;],
      [&#x27;桌面与云端&#x27;,&#x27;该仓库的主要对象是本地图片增强；官网云端生图、存储等能力需另行核实。&#x27;]
    ],sources:[&#x27;app&#x27;,&#x27;paper&#x27;,&#x27;license&#x27;,&#x27;site&#x27;]}
  };
  const body = root.querySelector(&#x27;#detail-rows&#x27;);

    const item = items[key];

    }
    sourceBox.replaceChildren();
    for (const sourceKey of item.sources) {

      a.target = &#x27;_blank&#x27;; a.rel = &#x27;noopener noreferrer&#x27;; sourceBox.append(a);

    for (const button of buttons) {

    if (save &amp;&amp; window.openai &amp;&amp; typeof window.openai.setWidgetState === &#x27;function&#x27;) {
      window.openai.setWidgetState({modelContent:{selectedModule:key},privateContent:{selectedModule:key}}).catch(() =&gt; {});

  }
  for (const button of buttons) button.addEventListener(&#x27;click&#x27;, () =&gt; select(button.dataset.key, true));
  const state = window.openai &amp;&amp; window.openai.widgetState;

    if (next) select(next.selectedModule || (next.privateContent &amp;&amp; next.privateContent.selectedModule) || (next.modelContent &amp;&amp; next.modelContent.selectedModule) || selected, false);
  });
  const surface = root.querySelector(&#x27;.map-surface&#x27;);
  const svg = root.querySelector(&#x27;.map-links&#x27;);
  const ns = &#x27;http://www.w3.org/2000/svg&#x27;;
  function draw() {
    const box = surface.getBoundingClientRect();
    const width = box.width, height = box.height;
    if (!width || !height) return;
    svg.setAttribute(&#x27;viewBox&#x27;, `0 0 ${width} ${height}`);
    svg.replaceChildren();
    const defs = document.createElementNS(ns,&#x27;defs&#x27;);
    for (let i=1;i&lt;=3;i++) {
      const marker = document.createElementNS(ns,&#x27;marker&#x27;);
      marker.id = `upscayl-arrow-${i}`; marker.setAttribute(&#x27;viewBox&#x27;,&#x27;0 0 10 10&#x27;);
      marker.setAttribute(&#x27;refX&#x27;,&#x27;8&#x27;); marker.setAttribute(&#x27;refY&#x27;,&#x27;5&#x27;); marker.setAttribute(&#x27;markerWidth&#x27;,&#x27;5&#x27;); marker.setAttribute(&#x27;markerHeight&#x27;,&#x27;5&#x27;); marker.setAttribute(&#x27;orient&#x27;,&#x27;auto-start-reverse&#x27;);
      const mark = document.createElementNS(ns,&#x27;path&#x27;); mark.setAttribute(&#x27;d&#x27;,&#x27;M 1 1 L 8 5 L 1 9 Z&#x27;); mark.setAttribute(&#x27;fill&#x27;,`var(--viz-series-${i})`); marker.append(mark); defs.append(marker);
    }
    svg.append(defs);
    const rect = (el) =&gt; { const r=el.getBoundingClientRect(); return {x:r.left-box.left,y:r.top-box.top,w:r.width,h:r.height}; };
    function path(d, series, arrow=false) {
      const p=document.createElementNS(ns,&#x27;path&#x27;); p.setAttribute(&#x27;d&#x27;,d); p.setAttribute(&#x27;fill&#x27;,&#x27;none&#x27;);
      p.setAttribute(&#x27;stroke&#x27;,`var(--viz-series-${series})`); p.setAttribute(&#x27;stroke-width&#x27;,&#x27;1.5&#x27;); p.setAttribute(&#x27;opacity&#x27;,&#x27;0.65&#x27;);

        path(`M ${top.x+top.w/2} ${top.y+top.h} V ${midY} H ${label.x+label.w/2} V ${label.y-5}`,index+1);

        path(`M ${x} ${nodes[0].y+nodes[0].h/2} V ${nodes[nodes.length-1].y+nodes[nodes.length-1].h/2}`,index+1);
        nodes.forEach(n=&gt;path(`M ${x} ${n.y+n.h/2} H ${n.x-3}`,index+1));

      }
    }
  } catch {
    storage = null;
  }
  const initialGlobals = {
    widgetState: state,
    statePersistence: storage == null ? "none" : "local",
  };

  const channel = new MessageChannel();
  channel.port1.addEventListener("message", (event) => {
    const data = event.data;
    if (typeof data !== "object" || data == null) {
      return;
    }
    if (data.type === "widget-state-write") {
      if (!Number.isSafeInteger(data.id) || data.id <= 0) {
        return;
      }
      let ok = false;
      try {
        if (storage != null) {
          const state = parseState(data.state);
          storage.setItem(storageKey, JSON.stringify(state));
          ok = true;
        }
      } catch {
        // Storage denial, quota limits, and invalid state return a failed receipt.
      }
      channel.port1.postMessage({
        type: "widget-state-result",
        id: data.id,
        ok,
      });
      return;
    }
    if (data.type === "height") {
      const height = data.height;
      if (
        typeof height === "number" &&
        Number.isFinite(height) &&
        height >= 0 &&
        height <= 10_000
      ) {
        frame.style.height = Math.ceil(height) + "px";
      }
      return;
    }
    if (data.type === "scroll-to") {
      const top = data.top;
      if (
        typeof top === "number" &&
        Number.isFinite(top) &&
        top >= 0 &&
        globalThis.navigator.userActivation?.isActive === true
      ) {
        globalThis.scrollTo({
          top: Math.ceil(
            globalThis.scrollY + frame.getBoundingClientRect().top + top,
          ),
        });
      }
      return;
    }
    if (data.type === "open-external") {
      const rawHref = data.href;
      if (typeof rawHref !== "string") {
        return;
      }
      let href;
      try {
        const url = new URL(rawHref, document.baseURI);
        if (url.protocol !== "https:") {
          return;
        }
        href = url.href;
      } catch {
        return;
      }
      if (globalThis.navigator.userActivation?.isActive === true) {
        const anchor = document.createElement("a");
        anchor.href = href;
        anchor.rel = "noopener noreferrer";
        anchor.target = "_blank";
        document.body.appendChild(anchor);
        anchor.click();
        anchor.remove();
      }
      return;
    }
    if (data.type === "follow-up") {
      const prompt = data.prompt;
      if (
        typeof prompt !== "string" ||
        globalThis.navigator.userActivation?.isActive !== true
      ) {
        return;
      }
      const title = data.title;
      globalThis.prompt(typeof title === "string" ? title : prompt, prompt);
    }
  });
  channel.port1.start();
  const srcdoc = frame.dataset.srcdoc;
  if (srcdoc == null) {
    return;
  }
  globalThis.addEventListener("resize", () => {
    const height = Number.parseFloat(frame.style.height);
    if (!Number.isFinite(height) || height <= viewportHeight) {
      frame.style.removeProperty("height");
    }
    viewportHeight = globalThis.innerHeight;
    channel.port1.postMessage({ type: "measure" });
  });
  frame.addEventListener(
    "load",
    () => {
      frame.contentWindow?.postMessage(
        { type: "codex-visualization-initialize" },
        "*",
        [channel.port2],
      );
    },
    { once: true },
  );
  // Match the trusted bootstrap element, not the same text in an authored title.
  frame.srcdoc = srcdoc.replace(
    '<script type="application/json" id="codex-visualization-widget-state">__CODEX_VISUALIZATION_WIDGET_STATE__<\/script>',
    () =>
      '<script type="application/json" id="codex-visualization-widget-state">' +
      JSON.stringify(initialGlobals).replaceAll("<", "\\u003c") +
      "<\/script>",
  );
  delete frame.dataset.srcdoc;
})();
</script>
</body>
</html>
