name: Validate research hub

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate catalog and README
        run: npm run check
      - name: Test project management scripts
        run: npm test
      - name: Build catalog preview
        run: npm run build
